name: Build Chroma Roll APK

# Yeh workflow GitHub ke apne free computer (cloud) pe chalta hai —
# tumhare Chromebook pe kuch bhi install/download nahi hota.
# Chalane ke liye: repo ke "Actions" tab mein jaake "Build Chroma Roll APK" > "Run workflow" dabao.

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Add the Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web game into the Android project
        run: npx cap sync android

      - name: Set app display name to CHROMA ROLL
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">CHROMA ROLL</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">CHROMA ROLL</string>#' android/app/src/main/res/values/strings.xml

      - name: Add AdMob App ID to manifest (fixes the crash)
        run: |
          sed -i '/<\/application>/i\    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2519831355714403~3861928738"/>' android/app/src/main/AndroidManifest.xml

      - name: Set custom app icon
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          ICON_SRC="icon.png"
          if [ ! -f "$ICON_SRC" ]; then ICON_SRC="www/skins/eclipse.png"; fi
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert "$ICON_SRC" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build the debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: chroma-roll-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
